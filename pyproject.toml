[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanda-chapter-kit"
version = "0.4.0"
description = "Stand up a NANDA chapter: a home network for personal agents with chartered admission, a council, a catalog on the NANDA Index, and federation — composed from the sm-* primitives."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sharath VC", email = "sharath@komputix.com" }]
keywords = ["nanda", "ai-agents", "chapter", "federation", "did-key", "a2a", "ai-catalog"]
dependencies = [
    # Audit 2026-11 fixed versions, published to PyPI.
    "sm-arp>=0.4.0,<0.5",
    "sm-org-server>=0.2.0,<0.3",
    "sm-org-agent>=0.2.0,<0.3",
    "sm-bridge>=0.11.0,<0.12",
    "sm-conformance>=0.4.0,<0.5",
    "sm-parc>=0.3.0,<0.4",
    "sm-dat>=0.3.0,<0.4",
    # Not on PyPI yet (trusted publisher pending); pinned to the commit that
    # merged its audit fix. Switch to "sm-oversight>=0.3.0,<0.4" once published.
    "sm-oversight @ git+https://github.com/Sharathvc23/sm-oversight@a60a5dd1cc786001e67eca6f2b22845b3c027b90",
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "cryptography>=42",
    "base58>=2.1",
    "jcs>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
nanda-chapter = "nanda_chapter.cli:main"

[tool.hatch.metadata]
# sm-oversight is the one git dependency left (see the dependencies comment).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["nanda_chapter"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "auto"
